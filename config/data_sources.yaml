# =============================================================================
# INCOIS-3D-OceanViz — Data Source Registry
# -----------------------------------------------------------------------------
# Every entry here becomes a selectable "source" in the frontend Variable
# Selector without touching backend route code. Add a new block and a
# matching loader in backend/app/services/ to extend the system.
# =============================================================================

sources:

  incois_las:
    label: "INCOIS Live Access Server"
    type: opendap
    kind: model
    base_url: "https://las.incois.gov.in/"
    # LAS exposes per-product DODS endpoints; this is the discovery root.
    # Concrete dataset URLs are resolved by services/opendap_client.py
    # via the LAS "getUI"/"products.xml" catalog.
    catalog_endpoint: "https://las.incois.gov.in/las/getUI.do"
    default_product: "ROMS_INDOFOS"
    protocol_notes: >
      LAS wraps THREDDS/DODS datasets. We query the catalog XML, extract the
      DAP endpoint for the requested product/variable, then open with xarray
      (engine=pydap) exactly like any other OPeNDAP source.
    # Access plan, tried in order by services/dataset_registry.py. Cached
    # NetCDF first so a warm cache is always preferred to a live DAP round
    # trip; reorder these two lines to flip that policy.
    access:
      - { mode: local_netcdf, path: "model_cache/incois_las_*.nc" }
      - { mode: opendap_catalog }
    variables: [sst, salinity, currents_u, currents_v, ssh, mld]
    default_bbox: [30, -10, 100, 30]   # [west, south, east, north] Indian Ocean
    auth_required: false

  copernicus_glorys:
    label: "Copernicus Marine GLORYS12V1 (GLOBAL_MULTIYEAR_PHY_001_030)"
    type: opendap
    kind: model
    base_url: "https://data.marine.copernicus.eu/product/GLOBAL_MULTIYEAR_PHY_001_030/description"
    # Copernicus Marine Service requires the `copernicusmarine` Python
    # toolbox (or its S3 mirror) for actual data pull; the description URL
    # above is documentation, not a data endpoint. See
    # backend/scripts/ingest_copernicus_glorys.py for the real fetch path.
    dataset_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m"
    access:
      - { mode: local_zarr, path: "model_cache/copernicus_glorys/{dataset_id}.zarr" }
      - { mode: local_zarr, path: "model_cache/copernicus_glorys/*.zarr" }
      - { mode: local_netcdf, path: "model_cache/copernicus_glorys/*.nc" }
    variables: [thetao, so, uo, vo, zos, mlotst]
    depth_levels_m: [0, 5, 10, 20, 30, 50, 75, 100, 150, 200, 300, 500, 750, 1000, 1500, 2000]
    default_bbox: [30, -10, 100, 30]
    auth_required: true
    auth_env: ["COPERNICUS_MARINE_USERNAME", "COPERNICUS_MARINE_PASSWORD"]

  argo_gdac:
    label: "Argo Global Data Assembly Center (Ifremer)"
    type: ftp_https
    kind: insitu_profile
    base_url_https: "https://data-argo.ifremer.fr"
    base_url_ftp: "ftp://ftp.ifremer.fr/ifremer/argo"
    index_file: "https://data-argo.ifremer.fr/ar_index_global_prof.txt"
    file_pattern: "{dac}/{float_id}/profiles/{R_or_D}{float_id}_{cycle}.nc"
    variables: [temp, psal, pres, doxy, chla]
    default_bbox: [30, -10, 100, 30]
    auth_required: false

  glider_ego_gdac:
    label: "OceanGliders / EGO Glider GDAC (Ifremer)"
    type: ftp_https
    kind: insitu_trajectory
    base_url_ftp: "ftp://ftp.ifremer.fr/ifremer/glider/v2"
    base_url_https: "https://data-argo.ifremer.fr/glider"   # https mirror
    index_file: "https://data-argo.ifremer.fr/glider/glider_index.txt"
    variables: [temperature, salinity, chlorophyll, backscatter, oxygen]
    default_bbox: [30, -10, 100, 30]
    auth_required: false

  # ---------------------------------------------------------------------------
  # ERDDAP tabledap station sources.
  #
  # Every entry below with `type: erddap_tabledap` is picked up at startup by
  # backend/app/plugins/mooring_erddap.py, which registers ONE PLUGIN PER
  # ENTRY. That means a new mooring array, CTD archive, ADCP station set or
  # tide-gauge network is added by copying one of these blocks — no Python,
  # no route code, no frontend change. The `kind` field decides the marker
  # style and the `record_shape` field decides whether the platform serves
  # depth profiles or time series.
  #
  # `base_url`/`dataset_id` below point at INCOIS's ERDDAP deployment; if
  # your instance publishes under different dataset IDs, change them here.
  # Any public ERDDAP works — the adapter is not INCOIS-specific.
  # ---------------------------------------------------------------------------

  incois_odis_moorings:
    label: "INCOIS ODIS — moored buoy network (OMNI / CALPS)"
    type: erddap_tabledap
    kind: mooring
    record_shape: timeseries
    base_url: "https://erddap.incois.gov.in/erddap"
    dataset_id: "incois_omni_moored_buoys"
    station_id_var: station
    lon_var: longitude
    lat_var: latitude
    time_var: time
    depth_var: depth
    marker_color: "#9d7fe0"
    # canonical variable name -> ERDDAP column name
    variables:
      temperature: sea_water_temperature
      salinity: sea_water_practical_salinity
      current_u: eastward_sea_water_velocity
      current_v: northward_sea_water_velocity
    default_bbox: [30, -10, 100, 30]
    auth_required: false
    notes: >
      Surface-met and subsurface records from the INCOIS moored buoy network.
      Reports at fixed depths over time, so served as time series rather than
      profiles.

  incois_odis_ctd:
    label: "INCOIS ODIS — shipboard CTD casts"
    type: erddap_tabledap
    kind: ctd_cast
    record_shape: profile
    base_url: "https://erddap.incois.gov.in/erddap"
    dataset_id: "incois_ctd_casts"
    station_id_var: station
    lon_var: longitude
    lat_var: latitude
    time_var: time
    depth_var: depth
    marker_color: "#6fd4f0"
    variables:
      temperature: sea_water_temperature
      salinity: sea_water_practical_salinity
      dissolved_oxygen: mass_concentration_of_oxygen_in_sea_water
    default_bbox: [30, -10, 100, 30]
    auth_required: false
    notes: >
      Discrete CTD casts — many depths at one time, so served through the same
      depth-vs-variable profile endpoint (and the same chart) as Argo floats.

  incois_odis:
    label: "INCOIS Ocean Data & Information System (ODIS) — portal root"
    type: rest
    kind: reference
    base_url: "https://incois.gov.in/odis/"
    variables: []
    default_bbox: [30, -10, 100, 30]
    auth_required: false
    notes: >
      Documentation/discovery entry only. ODIS aggregates many collections
      with differing schemas; the machine-readable ones are reached through
      the erddap_tabledap entries above rather than screen-scraping the portal.

# -----------------------------------------------------------------------------
# Regional domain used for default map framing and subsetting bounds.
# -----------------------------------------------------------------------------
default_domain:
  name: "Indian Ocean"
  west: 30
  south: -10
  east: 100
  north: 30
  surface_depth_m: 0
  max_depth_m: 2000
