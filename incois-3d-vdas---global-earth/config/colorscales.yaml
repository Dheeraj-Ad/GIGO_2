# =============================================================================
# Color Scales — perceptually-uniform oceanographic palettes
# (values approximate cmocean; used identically by backend (matplotlib) and
# frontend (WebGL) colorbar renderers so the two never visually diverge)
# =============================================================================

colorscales:

  thermal:
    stops: ["#042333", "#2c3395", "#7a2c8e", "#c4436a", "#f2794f", "#f9c93e", "#fdf5a6"]
    description: "Cool-to-warm, used for temperature"

  haline:
    stops: ["#2a186c", "#264da0", "#1a83a3", "#2ba88e", "#8ec969", "#e8dc4f", "#f9f7b5"]
    description: "Deep blue to pale green, used for salinity"

  speed:
    stops: ["#122740", "#0b6e83", "#1fa187", "#8fce5c", "#f4e04d", "#f77f26"]
    description: "Sequential, used for current speed magnitude"

  balance:
    stops: ["#1c3f5e", "#4a7fa6", "#d9e6e8", "#e8917a", "#a3352b"]
    description: "Diverging blue-white-red, used for signed fields (u/v, SSH)"

  deep:
    stops: ["#f7fbef", "#c6e2a0", "#66b6a0", "#2a7b6f", "#1a4a5e", "#0d1b3e"]
    description: "Light-to-dark, used for depth-like fields (MLD)"

  algae:
    stops: ["#e8f5d0", "#a8d68c", "#5cab5c", "#2c7a3e", "#0f4a2e", "#052414"]
    description: "Sequential green, used for chlorophyll (log scale)"

  oxy:
    stops: ["#4a1942", "#8c2f6e", "#c85a8a", "#e89b6b", "#f5cf6b", "#e8f0a0"]
    description: "Used for dissolved oxygen"

# UI defaults for the colorbar editor
editor_defaults:
  n_stops_editable: true
  allow_custom_hex: true
  allow_reverse: true
  scale_modes: ["linear", "log", "symlog"]
